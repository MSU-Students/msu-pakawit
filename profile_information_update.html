<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Information Update</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f7ff',
              100: '#e0effe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
            }
          }
        }
      }
    }
  </script>

  <!-- React & React DOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body {
      font-family: 'Inter', sans-serif;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(156, 163, 175, 0.4);
      border-radius: 9999px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(156, 163, 175, 0.6);
    }
  </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 transition-colors duration-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Helper Component for Dynamic Lucide Icons
    const Icon = ({ name, className = "w-5 h-5", size, ...props }) => {
      const iconRef = useRef(null);

      useEffect(() => {
        if (iconRef.current && window.lucide) {
          iconRef.current.innerHTML = '';
          const iconNode = window.lucide.createElement(window.lucide.icons[name] || window.lucide.icons['HelpCircle']);
          if (size) {
            iconNode.setAttribute('width', size);
            iconNode.setAttribute('height', size);
          }
          iconRef.current.appendChild(iconNode);
        }
      }, [name, size]);

      return <span ref={iconRef} className={`inline-flex items-center justify-center ${className}`} {...props} />;
    };

    // Default Initial Profile State
    const INITIAL_PROFILE = {
      fullName: 'Alex Rivera',
      email: 'alex.rivera@example.com',
      role: 'Senior Full Stack Developer',
      bio: 'Passionate software engineer with 5+ years of experience in building scalable web applications and intuitive UI design.',
      avatarUrl: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=400',
      skills: ['React', 'Node.js', 'TypeScript', 'Tailwind CSS', 'GraphQL']
    };

    function App() {
      // Theme State
      const [darkMode, setDarkMode] = useState(false);

      // Saved State vs Draft Form State
      const [savedProfile, setSavedProfile] = useState(INITIAL_PROFILE);
      const [formData, setFormData] = useState(INITIAL_PROFILE);
      const [skillInput, setSkillInput] = useState('');

      // Validation Errors
      const [errors, setErrors] = useState({});
      const [touched, setTouched] = useState({});

      // Network & Simulation Settings
      const [loading, setLoading] = useState(false);
      const [networkLatency, setNetworkLatency] = useState(800); // ms
      const [simulateServerError, setSimulateServerError] = useState(false);
      const [apiLogs, setApiLogs] = useState([]);

      // UI Controls
      const [toasts, setToasts] = useState([]);
      const [showGitModal, setShowGitModal] = useState(false);
      const [showLogs, setShowLogs] = useState(false);

      // Apply Dark Mode Class
      useEffect(() => {
        if (darkMode) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [darkMode]);

      // Toast Notification Handler
      const addToast = (type, title, message) => {
        const id = Date.now();
        setToasts((prev) => [...prev, { id, type, title, message }]);
        setTimeout(() => {
          removeToast(id);
        }, 4000);
      };

      const removeToast = (id) => {
        setToasts((prev) => prev.filter((toast) => toast.id !== id));
      };

      // Real-time Form Validation
      const validateField = (name, value) => {
        let error = '';
        if (name === 'fullName') {
          if (!value.trim()) error = 'Full name is required.';
          else if (value.trim().length < 2) error = 'Name must be at least 2 characters.';
          else if (value.trim().length > 50) error = 'Name cannot exceed 50 characters.';
        }

        if (name === 'email') {
          if (!value.trim()) error = 'Email is required.';
          else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)) error = 'Please enter a valid email address.';
        }

        if (name === 'role') {
          if (!value.trim()) error = 'Role is required.';
          else if (value.trim().length > 60) error = 'Role title is too long.';
        }

        if (name === 'bio') {
          if (value.length > 250) error = `Bio is too long (${value.length}/250 chars).`;
        }

        if (name === 'avatarUrl') {
          if (value.trim() && !/^https?:\/\/.+/.test(value)) {
            error = 'Please enter a valid URL (starting with http:// or https://).';
          }
        }

        return error;
      };

      // Validate Entire Form
      const validateForm = (dataToValidate) => {
        const newErrors = {};
        Object.keys(dataToValidate).forEach((key) => {
          if (key !== 'skills') {
            const err = validateField(key, dataToValidate[key]);
            if (err) newErrors[key] = err;
          }
        });
        return newErrors;
      };

      // Input Change Handler
      const handleChange = (e) => {
        const { name, value } = e.target;
        setFormData((prev) => ({ ...prev, [name]: value }));
        
        // Dynamic Validation on Change if Touched
        if (touched[name]) {
          const error = validateField(name, value);
          setErrors((prev) => ({ ...prev, [name]: error }));
        }
      };

      const handleBlur = (e) => {
        const { name, value } = e.target;
        setTouched((prev) => ({ ...prev, [name]: true }));
        const error = validateField(name, value);
        setErrors((prev) => ({ ...prev, [name]: error }));
      };

      // Skills Tag Management
      const handleAddSkill = (e) => {
        if ((e.key === 'Enter' || e.type === 'click') && skillInput.trim()) {
          e.preventDefault();
          const cleanSkill = skillInput.trim();
          if (formData.skills.length >= 10) {
            addToast('error', 'Limit Reached', 'You can add up to 10 skills maximum.');
            return;
          }
          if (formData.skills.some((s) => s.toLowerCase() === cleanSkill.toLowerCase())) {
            addToast('error', 'Duplicate Skill', 'This skill is already in your profile.');
            return;
          }
          setFormData((prev) => ({ ...prev, skills: [...prev.skills, cleanSkill] }));
          setSkillInput('');
        }
      };

      const handleRemoveSkill = (skillToRemove) => {
        setFormData((prev) => ({
          ...prev,
          skills: prev.skills.filter((s) => s !== skillToRemove)
        }));
      };

      // Handle Avatar File Upload Simulation
      const handleAvatarFile = (e) => {
        const file = e.target.files[0];
        if (file) {
          if (file.size > 2 * 1024 * 1024) {
            addToast('error', 'File Too Large', 'Please upload an image smaller than 2MB.');
            return;
          }
          const reader = new FileReader();
          reader.onloadend = () => {
            setFormData((prev) => ({ ...prev, avatarUrl: reader.result }));
            addToast('info', 'Image Uploaded', 'New profile picture selected.');
          };
          reader.readAsDataURL(file);
        }
      };

      // Add to Logger
      const logApiCall = (method, endpoint, status, responseData) => {
        const timestamp = new Date().toLocaleTimeString();
        setApiLogs((prev) => [
          { id: Date.now(), timestamp, method, endpoint, status, data: responseData },
          ...prev
        ]);
      };

      // Reset Form to Last Saved State
      const handleReset = () => {
        setFormData(savedProfile);
        setErrors({});
        setTouched({});
        addToast('info', 'Form Reset', 'Restored to last saved profile data.');
      };

      // Simulated Backend Endpoint Submission
      const handleSubmit = async (e) => {
        e.preventDefault();
        
        // Mark all fields touched
        const allTouched = { fullName: true, email: true, role: true, bio: true, avatarUrl: true };
        setTouched(allTouched);

        const formErrors = validateForm(formData);
        setErrors(formErrors);

        if (Object.keys(formErrors).length > 0) {
          addToast('error', 'Validation Failed', 'Please fix the errors in the form before saving.');
          return;
        }

        setLoading(true);

        // Network Delay Simulation
        setTimeout(() => {
          if (simulateServerError) {
            const errorPayload = { status: 500, error: 'Internal Server Error', message: 'Failed to update database record.' };
            logApiCall('PUT', '/api/v1/profile', 500, errorPayload);
            addToast('error', 'Server Error (500)', 'Failed to save changes. Please try again.');
            setLoading(false);
          } else {
            const successPayload = { status: 200, message: 'Profile updated successfully', profile: formData };
            setSavedProfile(formData);
            logApiCall('PUT', '/api/v1/profile', 200, successPayload);
            addToast('success', 'Profile Updated!', 'Your changes have been saved successfully.');
            setLoading(false);
          }
        }, networkLatency);
      };

      return (
        <div className="min-h-screen flex flex-col">
          {/* Header Bar */}
          <header className="sticky top-0 z-30 bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 shadow-sm">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              <div className="flex items-center space-x-3">
                <div className="p-2 bg-blue-600 text-white rounded-lg shadow-sm">
                  <Icon name="UserCheck" className="w-6 h-6" />
                </div>
                <div>
                  <h1 className="font-bold text-lg text-gray-900 dark:text-white leading-none">Profile Hub</h1>
                  <p className="text-xs text-gray-500 dark:text-gray-400 mt-0.5">Settings & Interactive Management</p>
                </div>
              </div>

              {/* Header Right Tools */}
              <div className="flex items-center space-x-2">
                <button
                  onClick={() => setShowGitModal(true)}
                  className="flex items-center space-x-1.5 px-3 py-1.5 text-xs font-medium bg-gray-100 hover:bg-gray-200 dark:bg-gray-700 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-200 rounded-md transition"
                >
                  <Icon name="GitPullRequest" className="w-4 h-4 text-blue-500" />
                  <span className="hidden sm:inline">Git Workflow</span>
                </button>

                <button
                  onClick={() => setShowLogs(!showLogs)}
                  className={`flex items-center space-x-1.5 px-3 py-1.5 text-xs font-medium rounded-md transition ${
                    showLogs 
                      ? 'bg-blue-100 text-blue-700 dark:bg-blue-900/50 dark:text-blue-300' 
                      : 'bg-gray-100 hover:bg-gray-200 dark:bg-gray-700 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-200'
                  }`}
                >
                  <Icon name="Terminal" className="w-4 h-4 text-emerald-500" />
                  <span className="hidden sm:inline">API Logs</span>
                  {apiLogs.length > 0 && (
                    <span className="ml-1 px-1.5 py-0.2 bg-blue-600 text-white text-[10px] rounded-full font-semibold">
                      {apiLogs.length}
                    </span>
                  )}
                </button>

                <button
                  onClick={() => setDarkMode(!darkMode)}
                  className="p-2 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-md transition"
                  title="Toggle Theme"
                >
                  <Icon name={darkMode ? 'Sun' : 'Moon'} className="w-5 h-5 text-amber-500" />
                </button>
              </div>
            </div>
          </header>

          {/* Main Layout Container */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
            {/* Developer Controls Bar (Simulating Latency and Error Behavior) */}
            <div className="mb-6 bg-gradient-to-r from-slate-800 to-slate-900 text-white rounded-xl p-4 shadow-md flex flex-wrap items-center justify-between gap-4">
              <div className="flex items-center space-x-2">
                <Icon name="Sliders" className="w-5 h-5 text-blue-400" />
                <span className="font-semibold text-sm">Simulated Backend Controls:</span>
              </div>
              <div className="flex flex-wrap items-center gap-6 text-xs">
                {/* Latency Slider */}
                <div className="flex items-center space-x-2">
                  <label htmlFor="latency" className="text-gray-300">Latency: <span className="font-mono text-blue-400 font-bold">{networkLatency}ms</span></label>
                  <input
                    id="latency"
                    type="range"
                    min="200"
                    max="3000"
                    step="100"
                    value={networkLatency}
                    onChange={(e) => setNetworkLatency(Number(e.target.value))}
                    className="w-24 accent-blue-500 cursor-pointer"
                  />
                </div>

                {/* Server Error Toggle */}
                <label className="flex items-center space-x-2 cursor-pointer select-none">
                  <input
                    type="checkbox"
                    checked={simulateServerError}
                    onChange={(e) => setSimulateServerError(e.target.checked)}
                    className="w-4 h-4 rounded text-blue-600 focus:ring-blue-500"
                  />
                  <span className={simulateServerError ? 'text-red-400 font-semibold' : 'text-gray-300'}>
                    Simulate 500 Server Error
                  </span>
                </label>
              </div>
            </div>

            {/* Content Grid: Left Form, Right Preview */}
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
              
              {/* Profile Edit Form Section */}
              <div className="lg:col-span-7 bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 p-6">
                <div className="flex items-center justify-between pb-4 mb-6 border-b border-gray-100 dark:border-gray-700">
                  <div>
                    <h2 className="text-xl font-bold text-gray-900 dark:text-white">Profile Settings</h2>
                    <p className="text-sm text-gray-500 dark:text-gray-400">Update your personal details and public profile presence.</p>
                  </div>
                  <button
                    type="button"
                    onClick={handleReset}
                    className="inline-flex items-center space-x-1 text-xs text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 hover:underline"
                  >
                    <Icon name="RotateCcw" className="w-3.5 h-3.5" />
                    <span>Reset Changes</span>
                  </button>
                </div>

                <form onSubmit={handleSubmit} className="space-y-6" noValidate>
                  {/* Avatar Upload Section */}
                  <div>
                    <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                      Profile Picture
                    </label>
                    <div className="flex items-center space-x-4">
                      <img
                        src={formData.avatarUrl || 'https://via.placeholder.com/150'}
                        alt="Avatar Preview"
                        className="w-16 h-16 rounded-full object-cover border-2 border-blue-500 shadow-sm"
                        onError={(e) => { e.target.src = 'https://placehold.co/150x150/2563eb/ffffff?text=Avatar'; }}
                      />
                      <div className="flex-1 space-y-2">
                        <div className="flex items-center space-x-2">
                          <label className="cursor-pointer inline-flex items-center px-3 py-1.5 bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 text-xs font-semibold text-gray-700 dark:text-gray-200 rounded-lg transition">
                            <Icon name="Upload" className="w-3.5 h-3.5 mr-1.5" />
                            Upload File
                            <input type="file" accept="image/*" onChange={handleAvatarFile} className="hidden" />
                          </label>
                          <span className="text-xs text-gray-400">PNG, JPG up to 2MB</span>
                        </div>
                        <input
                          type="url"
                          name="avatarUrl"
                          placeholder="Or enter image URL https://..."
                          value={formData.avatarUrl}
                          onChange={handleChange}
                          onBlur={handleBlur}
                          className={`w-full px-3 py-1.5 text-xs rounded-lg border dark:bg-gray-900 text-gray-800 dark:text-gray-200 focus:outline-none focus:ring-2 ${
                            errors.avatarUrl ? 'border-red-500 focus:ring-red-200' : 'border-gray-300 dark:border-gray-600 focus:ring-blue-500/20 focus:border-blue-500'
                          }`}
                        />
                        {errors.avatarUrl && <p className="text-red-500 text-xs">{errors.avatarUrl}</p>}
                      </div>
                    </div>
                  </div>

                  {/* Full Name & Role */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                        Full Name <span className="text-red-500">*</span>
                      </label>
                      <input
                        type="text"
                        name="fullName"
                        value={formData.fullName}
                        onChange={handleChange}
                        onBlur={handleBlur}
                        placeholder="John Doe"
                        className={`w-full px-3.5 py-2 text-sm rounded-lg border dark:bg-gray-900 text-gray-800 dark:text-gray-200 focus:outline-none focus:ring-2 ${
                          errors.fullName ? 'border-red-500 focus:ring-red-200' : 'border-gray-300 dark:border-gray-600 focus:ring-blue-500/20 focus:border-blue-500'
                        }`}
                      />
                      {errors.fullName && <p className="text-red-500 text-xs mt-1">{errors.fullName}</p>}
                    </div>

                    <div>
                      <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                        Role / Title <span className="text-red-500">*</span>
                      </label>
                      <input
                        type="text"
                        name="role"
                        value={formData.role}
                        onChange={handleChange}
                        onBlur={handleBlur}
                        placeholder="e.g. Lead Designer"
                        className={`w-full px-3.5 py-2 text-sm rounded-lg border dark:bg-gray-900 text-gray-800 dark:text-gray-200 focus:outline-none focus:ring-2 ${
                          errors.role ? 'border-red-500 focus:ring-red-200' : 'border-gray-300 dark:border-gray-600 focus:ring-blue-500/20 focus:border-blue-500'
                        }`}
                      />
                      {errors.role && <p className="text-red-500 text-xs mt-1">{errors.role}</p>}
                    </div>
                  </div>

                  {/* Email */}
                  <div>
                    <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                      Email Address <span className="text-red-500">*</span>
                    </label>
                    <div className="relative">
                      <span className="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                        <Icon name="Mail" className="w-4 h-4" />
                      </span>
                      <input
                        type="email"
                        name="email"
                        value={formData.email}
                        onChange={handleChange}
                        onBlur={handleBlur}
                        placeholder="john@example.com"
                        className={`w-full pl-10 pr-3.5 py-2 text-sm rounded-lg border dark:bg-gray-900 text-gray-800 dark:text-gray-200 focus:outline-none focus:ring-2 ${
                          errors.email ? 'border-red-500 focus:ring-red-200' : 'border-gray-300 dark:border-gray-600 focus:ring-blue-500/20 focus:border-blue-500'
                        }`}
                      />
                    </div>
                    {errors.email && <p className="text-red-500 text-xs mt-1">{errors.email}</p>}
                  </div>

                  {/* Bio */}
                  <div>
                    <div className="flex justify-between items-center mb-1">
                      <label className="block text-sm font-medium text-gray-700 dark:text-gray-300">
                        Bio
                      </label>
                      <span className={`text-xs ${formData.bio.length > 250 ? 'text-red-500 font-bold' : 'text-gray-400'}`}>
                        {formData.bio.length}/250
                      </span>
                    </div>
                    <textarea
                      name="bio"
                      rows="3"
                      value={formData.bio}
                      onChange={handleChange}
                      onBlur={handleBlur}
                      placeholder="Write a brief description about yourself..."
                      className={`w-full px-3.5 py-2 text-sm rounded-lg border dark:bg-gray-900 text-gray-800 dark:text-gray-200 focus:outline-none focus:ring-2 ${
                        errors.bio ? 'border-red-500 focus:ring-red-200' : 'border-gray-300 dark:border-gray-600 focus:ring-blue-500/20 focus:border-blue-500'
                      }`}
                    ></textarea>
                    {errors.bio && <p className="text-red-500 text-xs mt-1">{errors.bio}</p>}
                  </div>

                  {/* Skills Tag Input */}
                  <div>
                    <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                      Skills & Expertise
                    </label>
                    <div className="flex gap-2 mb-2">
                      <input
                        type="text"
                        value={skillInput}
                        onChange={(e) => setSkillInput(e.target.value)}
                        onKeyDown={handleAddSkill}
                        placeholder="Add a skill and press Enter"
                        className="flex-1 px-3.5 py-1.5 text-sm rounded-lg border border-gray-300 dark:border-gray-600 dark:bg-gray-900 text-gray-800 dark:text-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500"
                      />
                      <button
                        type="button"
                        onClick={handleAddSkill}
                        className="px-3 py-1.5 bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-200 text-xs font-medium rounded-lg transition flex items-center space-x-1"
                      >
                        <Icon name="Plus" className="w-4 h-4" />
                        <span>Add</span>
                      </button>
                    </div>

                    <div className="flex flex-wrap gap-2 mt-2">
                      {formData.skills.map((skill, index) => (
                        <span
                          key={index}
                          className="inline-flex items-center space-x-1 px-2.5 py-1 bg-blue-50 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300 text-xs font-medium rounded-full border border-blue-200 dark:border-blue-800"
                        >
                          <span>{skill}</span>
                          <button
                            type="button"
                            onClick={() => handleRemoveSkill(skill)}
                            className="text-blue-500 hover:text-blue-700 dark:hover:text-blue-200 ml-1 rounded-full"
                          >
                            <Icon name="X" className="w-3 h-3" />
                          </button>
                        </span>
                      ))}
                      {formData.skills.length === 0 && (
                        <span className="text-xs text-gray-400 italic">No skills added yet.</span>
                      )}
                    </div>
                  </div>

                  {/* Form Actions */}
                  <div className="pt-4 border-t border-gray-100 dark:border-gray-700 flex items-center justify-end space-x-3">
                    <button
                      type="button"
                      onClick={handleReset}
                      className="px-4 py-2 text-sm font-medium text-gray-700 dark:text-gray-300 bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 rounded-lg transition"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      disabled={loading}
                      className="px-5 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg shadow-sm transition flex items-center space-x-2 disabled:opacity-50 disabled:cursor-not-allowed"
                    >
                      {loading ? (
                        <>
                          <Icon name="Loader2" className="w-4 h-4 animate-spin" />
                          <span>Saving Changes...</span>
                        </>
                      ) : (
                        <>
                          <Icon name="Save" className="w-4 h-4" />
                          <span>Save Changes</span>
                        </>
                      )}
                    </button>
                  </div>
                </form>
              </div>

              {/* Live Profile Card Preview */}
              <div className="lg:col-span-5 space-y-6">
                <div className="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 overflow-hidden">
                  <div className="bg-gradient-to-r from-blue-600 to-indigo-600 h-24 relative">
                    <div className="absolute -bottom-8 left-6">
                      <img
                        src={formData.avatarUrl || 'https://via.placeholder.com/150'}
                        alt={formData.fullName}
                        className="w-20 h-20 rounded-full border-4 border-white dark:border-gray-800 object-cover shadow-md"
                        onError={(e) => { e.target.src = 'https://placehold.co/150x150/2563eb/ffffff?text=Avatar'; }}
                      />
                    </div>
                    <div className="absolute top-3 right-3 px-2.5 py-1 bg-black/30 backdrop-blur-md rounded-full text-[10px] text-white font-medium flex items-center space-x-1">
                      <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                      <span>Live Preview</span>
                    </div>
                  </div>

                  <div className="pt-10 px-6 pb-6">
                    <div>
                      <h3 className="text-lg font-bold text-gray-900 dark:text-white leading-snug">
                        {formData.fullName || 'Your Name'}
                      </h3>
                      <p className="text-sm text-blue-600 dark:text-blue-400 font-medium">
                        {formData.role || 'Your Title/Role'}
                      </p>
                      <p className="text-xs text-gray-500 dark:text-gray-400 mt-1 flex items-center">
                        <Icon name="Mail" className="w-3.5 h-3.5 mr-1 text-gray-400" />
                        {formData.email || 'email@example.com'}
                      </p>
                    </div>

                    <div className="mt-4 pt-4 border-t border-gray-100 dark:border-gray-700">
                      <h4 className="text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">About</h4>
                      <p className="text-xs text-gray-600 dark:text-gray-300 leading-relaxed min-h-[40px]">
                        {formData.bio || 'Your bio will appear here as you type.'}
                      </p>
                    </div>

                    <div className="mt-4">
                      <h4 className="text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">Skills</h4>
                      <div className="flex flex-wrap gap-1.5">
                        {formData.skills.length > 0 ? (
                          formData.skills.map((skill, i) => (
                            <span key={i} className="px-2 py-0.5 text-[11px] font-medium bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300 rounded">
                              {skill}
                            </span>
                          ))
                        ) : (
                          <span className="text-xs text-gray-400 italic">No skills specified</span>
                        )}
                      </div>
                    </div>
                  </div>
                </div>

                {/* API Request Logs Visualizer */}
                {showLogs && (
                  <div className="bg-gray-900 text-gray-100 rounded-xl shadow-md p-4 border border-gray-800 text-xs font-mono">
                    <div className="flex items-center justify-between pb-2 mb-2 border-b border-gray-800">
                      <div className="flex items-center space-x-2">
                        <Icon name="Terminal" className="w-4 h-4 text-emerald-400" />
                        <span className="font-semibold text-gray-200">REST API Network Console</span>
                      </div>
                      <button
                        onClick={() => setApiLogs([])}
                        className="text-gray-400 hover:text-white text-[10px] underline"
                      >
                        Clear Logs
                      </button>
                    </div>

                    <div className="max-h-60 overflow-y-auto space-y-3 custom-scrollbar pr-1">
                      {apiLogs.length === 0 ? (
                        <p className="text-gray-500 italic py-2 text-center">No API requests recorded yet. Submit the form to see network traffic.</p>
                      ) : (
                        apiLogs.map((log) => (
                          <div key={log.id} className="p-2 rounded bg-gray-800/80 border border-gray-700/50 space-y-1">
                            <div className="flex items-center justify-between">
                              <span className="text-gray-400 text-[10px]">{log.timestamp}</span>
                              <span className={`px-1.5 py-0.5 rounded text-[10px] font-bold ${
                                log.status === 200 ? 'bg-emerald-900/80 text-emerald-300' : 'bg-red-900/80 text-red-300'
                              }`}>
                                HTTP {log.status}
                              </span>
                            </div>
                            <div className="text-blue-400 font-semibold">
                              {log.method} <span className="text-gray-200">{log.endpoint}</span>
                            </div>
                            <pre className="text-[10px] text-gray-300 bg-gray-950 p-1.5 rounded overflow-x-auto">
                              {JSON.stringify(log.data, null, 2)}
                            </pre>
                          </div>
                        ))
                      )}
                    </div>
                  </div>
                )}
              </div>
            </div>
          </main>

          {/* Toast Notification Floating Container */}
          <div className="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 max-w-sm w-full">
            {toasts.map((toast) => (
              <div
                key={toast.id}
                className={`flex items-start p-3.5 rounded-xl shadow-lg border text-sm transition-all transform translate-y-0 ${
                  toast.type === 'success'
                    ? 'bg-emerald-50 dark:bg-emerald-950 border-emerald-200 dark:border-emerald-800 text-emerald-900 dark:text-emerald-100'
                    : toast.type === 'error'
                    ? 'bg-red-50 dark:bg-red-950 border-red-200 dark:border-red-800 text-red-900 dark:text-red-100'
                    : 'bg-blue-50 dark:bg-blue-950 border-blue-200 dark:border-blue-800 text-blue-900 dark:text-blue-100'
                }`}
              >
                <div className="mr-3 mt-0.5">
                  {toast.type === 'success' && <Icon name="CheckCircle2" className="w-5 h-5 text-emerald-600 dark:text-emerald-400" />}
                  {toast.type === 'error' && <Icon name="AlertTriangle" className="w-5 h-5 text-red-600 dark:text-red-400" />}
                  {toast.type === 'info' && <Icon name="Info" className="w-5 h-5 text-blue-600 dark:text-blue-400" />}
                </div>
                <div className="flex-1">
                  <h5 className="font-semibold text-xs">{toast.title}</h5>
                  <p className="text-xs opacity-90 mt-0.5">{toast.message}</p>
                </div>
                <button
                  onClick={() => removeToast(toast.id)}
                  className="ml-2 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200"
                >
                  <Icon name="X" className="w-4 h-4" />
                </button>
              </div>
            ))}
          </div>

          {/* Git Instructions Modal */}
          {showGitModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm">
              <div className="bg-white dark:bg-gray-800 rounded-xl shadow-xl max-w-lg w-full p-6 border border-gray-200 dark:border-gray-700 relative">
                <button
                  onClick={() => setShowGitModal(false)}
                  className="absolute top-4 right-4 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200"
                >
                  <Icon name="X" className="w-5 h-5" />
                </button>

                <div className="flex items-center space-x-2 text-blue-600 dark:text-blue-400 mb-4">
                  <Icon name="GitPullRequest" className="w-6 h-6" />
                  <h3 className="text-lg font-bold text-gray-900 dark:text-white">Git Workflow & Submission Guide</h3>
                </div>

                <p className="text-xs text-gray-600 dark:text-gray-300 mb-4">
                  Follow these terminal commands to push your profile feature branch and create a Pull Request for assignment submission:
                </p>

                <div className="space-y-3 text-xs font-mono">
                  <div className="bg-gray-900 text-gray-200 p-3 rounded-lg border border-gray-800 space-y-1">
                    <p className="text-gray-500"># 1. Clone Repo & Checkout Branch</p>
                    <p className="text-emerald-400">git clone https://github.com/your-org/repo-name.git</p>
                    <p className="text-emerald-400">cd repo-name</p>
                    <p className="text-emerald-400">git checkout -b feature/profile-information-update</p>
                  </div>

                  <div className="bg-gray-900 text-gray-200 p-3 rounded-lg border border-gray-800 space-y-1">
                    <p className="text-gray-500"># 2. Stage Changes & Commit</p>
                    <p className="text-emerald-400">git add .</p>
                    <p className="text-emerald-400">git commit -m "feat: complete profile editing form and api integration"</p>
                  </div>

                  <div className="bg-gray-900 text-gray-200 p-3 rounded-lg border border-gray-800 space-y-1">
                    <p className="text-gray-500"># 3. Push to GitHub & Create PR</p>
                    <p className="text-emerald-400">git push origin feature/profile-information-update</p>
                  </div>
                </div>

                <div className="mt-5 pt-4 border-t border-gray-100 dark:border-gray-700 flex justify-end">
                  <button
                    onClick={() => setShowGitModal(false)}
                    className="px-4 py-2 text-xs font-medium bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition"
                  >
                    Got it
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
