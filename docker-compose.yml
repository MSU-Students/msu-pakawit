services:
  postgres:
    image: postgres:16-alpine
    container_name: msu_pakawit_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: msu_pakawit_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d msu_pakawit_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - msu-network

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: msu_pakawit_api
    environment:
      PORT: 5000
      NODE_ENV: development
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: msu_pakawit_db
      DATABASE_SYNCHRONIZE: "true"
      JWT_SECRET: msu_pakawit_dev_secret_key_2026
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./api:/app/api
      - /app/api/node_modules
    networks:
      - msu-network

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: msu_pakawit_client
    environment:
      VITE_API_BASE_URL: http://localhost:5000/api
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ./client:/app/client
      - /app/client/node_modules
    networks:
      - msu-network

volumes:
  postgres_data:
    driver: local

networks:
  msu-network:
    driver: bridge
